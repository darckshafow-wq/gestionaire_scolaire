<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer dark blue ring -->
  <circle cx="100" cy="100" r="98" fill="#003087" />
  <!-- White inner circle -->
  <circle cx="100" cy="100" r="82" fill="white" />
  <!-- Inner thin blue ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#003087" stroke-width="3"/>
  <!-- Red circle background -->
  <circle cx="100" cy="100" r="62" fill="white" />

  <!-- Red M/arch shape (stylized) -->
  <path d="M72 115 C72 85, 82 68, 100 68 C118 68, 128 85, 128 115" 
        fill="none" stroke="#cc0000" stroke-width="14" stroke-linecap="round"/>
  <path d="M75 115 L75 95" stroke="#cc0000" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M125 115 L125 95" stroke="#cc0000" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- EPI text -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial Black, sans-serif" 
        font-size="22" font-weight="900" fill="#1a1a1a" letter-spacing="3">EPI</text>

  <!-- Arc top text "ÉCOLE POLYTECHNIQUE INTERNATIONALE" -->
  <path id="topArc" d="M 20 100 A 80 80 0 0 1 180 100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="white" letter-spacing="1">
    <textPath href="#topArc" startOffset="5%">ÉCOLE POLYTECHNIQUE INTERNATIONALE</textPath>
  </text>

  <!-- Arc bottom text "YAMOUSSOUKRO" -->
  <path id="bottomArc" d="M 22 110 A 80 80 0 0 0 178 110" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="white" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="18%">YAMOUSSOUKRO</textPath>
  </text>

  <!-- Gold "3" decorators -->
  <text x="30" y="158" text-anchor="middle" font-family="serif" font-size="14" 
        font-weight="bold" fill="#f4c430">ვ</text>
  <text x="170" y="158" text-anchor="middle" font-family="serif" font-size="14" 
        font-weight="bold" fill="#f4c430">ვ</text>
</svg>
